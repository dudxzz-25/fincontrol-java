name: Build

on:
  push:
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile
        run: bash build.sh
      - name: Run CLI smoke test
        run: |
          cp data/accounts.csv /tmp/accounts.csv
          printf "1\n999\nCI User\nC\n2\n999\n150\n5\n0\n" | java -cp out com.eduardo.fincontrol.Main > /tmp/fincontrol.out
          grep -q "CI User" /tmp/fincontrol.out
          grep -q "saldo R\$ 150.00" /tmp/fincontrol.out
          mv /tmp/accounts.csv data/accounts.csv
